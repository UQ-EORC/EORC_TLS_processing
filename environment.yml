# conda env create -f environment.yml && conda activate tls
name: tls
channels:
  - conda-forge
dependencies:
  - python=3.12         # 3.11+ for the pipeline (tomllib), at most 3.12 for segfix
  - numpy>=1.24
  - scipy>=1.10
  - matplotlib>=3.7
  - rasterio>=1.3
  - laspy>=2.5
  - lazrs-python        # LAZ backend for laspy
  - pyarrow             # merge_shots.py
  - pip
  - pip:
      - sylva-rs>=0.3.1   # imported as sylva
      - segfix>=1.2       # the manual editing step (GUI, PyQt6)
