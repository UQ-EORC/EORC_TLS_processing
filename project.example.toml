# project.toml: put it in the project root (the folder that holds one folder per plot). Paths are relative to that root
# unless absolute; {plot} is replaced by the plot's name. Every key is optional.

[paths]
exports = "exports"                     # RiSCAN PRO exports: <exports>/<PLOT>/*.laz (one per scan, SOCS), POINT_FILTERS.txt, PRCS/*.DAT
scratch = "~/tls_scratch"               # fast local disk for temporary files ($TLS_SCRATCH overrides)
raycloudtools_sif = "/path/to/raycloudtools.sif"   # apptainer image with rayextract, for the raycloudtools QSMs ($RCT_SIF)
pyarrow_python = "/path/to/python"      # a Python with pyarrow, for merge_shots.py (default: the running Python)

[defaults]                              # apply to every plot unless the plot sets its own
registration = "export"                 # export: the exports' PRCS matrices; coreg: sylva.coreg from them; previous: previous_transforms
# filter = "{plot}/01_scans/my_filter.txt"   # point filter file instead of <exports>/<PLOT>/POINT_FILTERS.txt
# previous_transforms = "{plot}/03_registration/delivered_transforms.json"   # scans[].name, world_from_scan (4x4)
# manual_trees = "../trees/{plot}"      # one point cloud per tree (.ply/.las/.laz); the plot gets stages 07-09
# manual_trees_table = "../trees/{plot}/trees.csv"   # columns treeid, file (relative to manual_trees); else id = last number in the name
# manual_trees_frame = "{plot}/03_registration/delivered_dat"   # .DAT matrices the trees were made in (default: the merge's)
# inventory = "../inventory/{plot}.csv"  # field stem map, for the plot box
inventory_x = "x"
inventory_y = "y"
# inventory_frame = "{plot}/03_registration/delivered_dat"      # .DAT matrices the inventory coordinates are in

[plot_box]
size_m = 100                            # plot side; an inventory spanning size_m +- tolerance_m gets a square of this size
tolerance_m = 4
isolated_stem_m = 15                    # inventory stems farther than this from any other are ignored

[plots.PLOT_A_2025]                     # one table per plot; the name is the plot's folder (and its exports folder)
code = "PLTA"                           # optional site code and name, carried into the records
name = "Plot A"

[plots.PLOT_B_2025]
registration = "coreg"
no_prior = ["ScanPos012"]               # scans whose export matrix is wrong: coreg places them without it
unregistered = ["tilt 003"]             # scans in the project that were never registered
manual_trees = "../trees/{plot}"
