# project.toml: put it in the project root (the folder that holds one folder per plot). Paths are relative to that root
# unless absolute; {plot} is replaced by the plot's name. Every key is optional.

[paths]
# exports = "exports"                   # only for source = "exports": <exports>/<PLOT>/*.laz (one per scan, SOCS), POINT_FILTERS.txt, PRCS/*.DAT
scratch = "~/tls_scratch"               # fast local disk for temporary files ($TLS_SCRATCH overrides)
raycloudtools_sif = "/path/to/raycloudtools.sif"   # apptainer image with rayextract, for the raycloudtools QSMs ($RCT_SIF)
# pyarrow_python = "/path/to/python"    # a Python with pyarrow, for merge_shots.py (default: the running Python; the conda env has it)

[defaults]                              # apply to every plot unless the plot sets its own
source = "riscan"                       # riscan: the RiSCAN PRO project in <PLOT>/00_raw (.rdbx scans, .rxp pulses, SOPs from project.rsp)
                                        # exports: per-scan RiSCAN PRO LAZ exports in <exports>/<PLOT> (older plots)
# riscan = "{plot}/00_raw/MyPlot.RiSCAN"  # the project, if 00_raw holds more than one *.RiSCAN folder
registration = "sop"                    # sop: the project's SOP matrices; coreg: sylva.coreg from them; previous: previous_transforms
# filter = "filters/point_filter.txt"   # point filter file (range, reflectance, deviation, amplitude, omit); none by default
ground = { method = "pmf", cell_size = 2.0, max_window = 40.0 }   # stage-05 ground filter (sylva.ground.classify_ground_<method> keywords)
# previous_transforms = "{plot}/03_registration/delivered_transforms.json"   # scans[].name, world_from_scan (4x4)
# manual_trees = "../trees/{plot}"      # one point cloud per tree (.ply/.las/.laz), transferred in stage 07
segment_trees = true                    # plots without manual trees are segmented automatically (stage 07); false: no tree stages
# manual_trees_table = "../trees/{plot}/trees.csv"   # columns treeid, file (relative to manual_trees); else id = last number in the name
# manual_trees_frame = "{plot}/03_registration/delivered_dat"   # .DAT matrices the trees were made in (default: the merge's)
# inventory = "../inventory/{plot}.csv"  # field stem map, for the plot box
inventory_x = "x"
inventory_y = "y"
# inventory_frame = "{plot}/03_registration/delivered_dat"      # .DAT matrices the inventory coordinates are in

[plot_box]                              # the plot box: a square placed on the inventory and the scans (s99_plot.py --bounds)
size_m = 100                            # side of the square (100 m: 1 ha)
max_rotation_deg = 10                   # the square may turn this far either way
cover_r_m = 15                          # a scan position covers the ground within this distance
stem_slack = 0.01                       # share of the inventory stems a square may leave out
cover_slack = 0.005                     # share of the best scan coverage a square may give up
isolated_stem_m = 15                    # inventory stems farther than this from any other are ignored

[plots.PLOT_A_2025]                     # one table per plot; the name is the plot's folder
code = "PLTA"                           # optional site code and name, carried into the records
name = "Plot A"

[plots.PLOT_B_2025]
registration = "coreg"
no_prior = ["ScanPos012"]               # scans whose SOP is wrong: coreg places them without it
unregistered = ["tilt 003"]             # scans in the project that were never registered
ground = { method = "csf", cloth_resolution = 1.0, rigidness = 1 }   # steep terrain: PMF cut banks away (scanners well above the DTM)
scan_grid_rings = 1                     # scan positions on a regular grid: plot box along the grid, outer ring left out
manual_trees = "../trees/{plot}"
